# local: your laptop. PostgreSQL and Redis start from compose.yaml by itself.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Keep the token after a page reload, so you log in once per day, not once per click.
springdoc.swagger-ui.persist-authorization=true

# LOCAL ONLY. Not secret. prod has no default and needs APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:dev-only-jwt-secret-not-for-production-0001}
# LOCAL ONLY. Not secret. prod has no default and needs APP_SESSION_SECRET.
app.session.hash-secret=${APP_SESSION_SECRET:dev-only-session-secret-not-for-production-01}
app.otp.channels=log
# LOCAL ONLY. Not secret. prod has no default and needs APP_OTP_SECRET.
app.otp.hash-secret=${APP_OTP_SECRET:dev-only-otp-secret-not-for-production-0001}

# LOCAL ONLY. A brand-new local database needs one user to attach created_by to (dev data's vehicle
# assignments, enquiries, ...), and OwnerBootstrap only acts when this is set. Set your own real phone
# here (or export APP_OWNER_PHONE, which always wins) to log in as yourself instead.
app.bootstrap.owner-phone=${APP_OWNER_PHONE:9999900000}

# No WhatsApp provider yet (question C1): the owner approves notification templates by hand.
app.notifications.manual-approval=true

# LOCAL ONLY, not secret: lets you try the provider webhooks with curl (sign the body with this value).
app.messaging.webhook.secret=${APP_PROVIDER_WEBHOOK_SECRET:local-only-webhook-secret-not-for-production-01}
