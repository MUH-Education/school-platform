# Safe defaults for every profile. The "local" and "prod" profiles each have their own
# application-<profile>.properties file alongside this one; Spring Boot picks the right
# one by itself from the active profile name. Only "test" (Testcontainers) stays here.
# Secrets never live in this file. They come from environment variables.
spring:
  application:
    name: school-admin
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # The code checks every real limit with a clear message: photo 2 MB (PhotoRules), notification files
      # 5 to 16 MB (MediaRules). These two numbers only stop huge uploads, so they sit just above 16 MB.
      max-file-size: 20MB
      max-request-size: 21MB

# API docs (springdoc). OFF by default, so any profile except local and test has no docs and no Swagger page.
# SecurityConfig opens /v3/api-docs and /swagger-ui only when these are true.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  zone: Asia/Kolkata
  jwt:
    secret: ${APP_JWT_SECRET}      # at least 32 bytes
  session:
    idle-timeout: 15m              # slides forward on every request; an active login never times out mid-use
    max-lifetime: 12h              # hard cap from login, no matter how active: one school day
    hash-secret: ${APP_SESSION_SECRET}
  otp:
    length: 6
    ttl: 5m
    max-attempts: 3
    resend-after: 60s
    max-per-hour: 5
    max-per-ip-per-hour: 20
    channels: whatsapp,sms         # try in this order; "log" in local
    hash-secret: ${APP_OTP_SECRET}
  bootstrap:
    owner-phone: ${APP_OWNER_PHONE:}   # first OWNER, created only if no user exists
  messaging:
    sms-provider: log              # log | msg91 | ...
    whatsapp-provider: log
    provider:                      # used by the one ProviderApi class (see messaging/ProviderApi.java)
      base-url: ${APP_PROVIDER_BASE_URL:}
      auth-key: ${APP_PROVIDER_AUTH_KEY:}              # secret, environment variable only
      sender-id: ${APP_PROVIDER_SENDER_ID:}            # DLT sender id (header)
      otp-sms-template-id: ${APP_PROVIDER_OTP_SMS_TEMPLATE_ID:}
      whatsapp-otp-template: ${APP_PROVIDER_WHATSAPP_OTP_TEMPLATE:}
      timeout: 5s
    worker-enabled: true           # the OutboxWorker runs every 5 seconds. Tests turn it off and call runOnce().
  notifications:
    manual-approval: false         # true only in local and test: the owner approves templates by hand (no provider yet)
  storage:                         # student photos and notification files (FileStorage)
    type: local                    # local = a folder on this machine. prod: S3FileStorage comes in Phase 9.
    folder: ./data/photos          # the folder is in .gitignore. Same folder as before the rename.

---
# test: ./gradlew test. PostgreSQL comes from Testcontainers.
spring:
  config:
    activate:
      on-profile: test

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  jwt:
    # TEST ONLY. Not secret. prod has no default and needs APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:dev-only-jwt-secret-not-for-production-0001}
  session:
    # TEST ONLY. Not secret. prod has no default and needs APP_SESSION_SECRET.
    hash-secret: ${APP_SESSION_SECRET:dev-only-session-secret-not-for-production-01}
  otp:
    channels: log
    # TEST ONLY. Not secret. prod has no default and needs APP_OTP_SECRET.
    hash-secret: ${APP_OTP_SECRET:dev-only-otp-secret-not-for-production-0001}
  messaging:
    worker-enabled: false          # tests call OutboxWorker.runOnce() by hand
  notifications:
    manual-approval: true          # tests approve templates by hand
