# Safe defaults for every profile. Profiles below change only what differs.
# Secrets never live in this file. They come from environment variables.
spring:
  application:
    name: school-admin
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # The photo limit is 2 MB and the code checks it with a clear message (PhotoRules).
      # The student CSV may be bigger. These two numbers only stop huge uploads.
      max-file-size: 5MB
      max-request-size: 6MB

# API docs (springdoc). OFF by default, so any profile except dev and test has no docs and no Swagger page.
# SecurityConfig opens /v3/api-docs and /swagger-ui only when these are true.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  zone: Asia/Kolkata
  jwt:
    secret: ${APP_JWT_SECRET}      # at least 32 bytes
    ttl: 30d
  otp:
    length: 6
    ttl: 5m
    max-attempts: 5
    resend-after: 60s
    max-per-hour: 5
    max-per-ip-per-hour: 20
    channels: whatsapp,sms         # try in this order; "log" in dev
    hash-secret: ${APP_OTP_SECRET}
  bootstrap:
    owner-phone: ${APP_OWNER_PHONE:}   # first OWNER, created only if no user exists
  messaging:
    sms-provider: log              # log | msg91 | ...
    whatsapp-provider: log
    provider:                      # used by the one ProviderApi class (see messaging/ProviderApi.java)
      base-url: ${APP_PROVIDER_BASE_URL:}
      auth-key: ${APP_PROVIDER_AUTH_KEY:}              # secret, environment variable only
      sender-id: ${APP_PROVIDER_SENDER_ID:}            # DLT sender id (header)
      otp-sms-template-id: ${APP_PROVIDER_OTP_SMS_TEMPLATE_ID:}
      whatsapp-otp-template: ${APP_PROVIDER_WHATSAPP_OTP_TEMPLATE:}
      timeout: 5s
    worker-enabled: true           # the OutboxWorker runs every 5 seconds. Tests turn it off and call runOnce().
  photos:
    storage: local                 # local = a folder on this machine. prod: S3PhotoStorage comes in Phase 9.
    folder: ./data/photos          # the folder is in .gitignore

---
# dev: your laptop. PostgreSQL starts from compose.yaml by itself.
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # Keep the token after a page reload, so you log in once per day, not once per click.
    persist-authorization: true

app:
  jwt:
    # DEV ONLY. Not secret. prod has no default and needs APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:dev-only-jwt-secret-not-for-production-0001}
  otp:
    channels: log
    # DEV ONLY. Not secret. prod has no default and needs APP_OTP_SECRET.
    hash-secret: ${APP_OTP_SECRET:dev-only-otp-secret-not-for-production-0001}

---
# test: ./gradlew test. PostgreSQL comes from Testcontainers.
spring:
  config:
    activate:
      on-profile: test

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  jwt:
    # TEST ONLY. Not secret. prod has no default and needs APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:dev-only-jwt-secret-not-for-production-0001}
  otp:
    channels: log
    # TEST ONLY. Not secret. prod has no default and needs APP_OTP_SECRET.
    hash-secret: ${APP_OTP_SECRET:dev-only-otp-secret-not-for-production-0001}
  messaging:
    worker-enabled: false          # tests call OutboxWorker.runOnce() by hand

---
# prod: the server.
# Database: set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD. Spring Boot reads them by itself.
# Messages: Phase 5 sets the real SMS and WhatsApp provider (question C1).
spring:
  config:
    activate:
      on-profile: prod

# No API docs and no Swagger page on the server. Nobody can turn them on by accident: this is also the default above.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
